nt:counter(step);position:absolute;left:0;top:0;display:grid;place-items:center;width:30px;height:30px;background:var(--mint);color:var(--accent);border-radius:50%;font-size:14px;font-weight:650}.steps li:not(:last-child):after{content:'';position:absolute;width:1px;background:var(--line);left:15px;top:38px;bottom:8px}.steps li:last-child{padding-bottom:0}.test-note{border-top:1px solid var(--line);padding-top:18px;font-size:14px;color:var(--muted)}.actions{padding:0;list-style:none;margin:24px 0 28px}.actions li{padding:18px 20px;margin:0 0 10px;background:#edf4ef;border-radius:9px;font-size:16px}.actions li strong{display:block;margin-bottom:5px;color:var(--accent)}.endnote{padding:32px 0 34px;color:var(--muted);font-size:13px;line-height:1.9}.footer-title{color:var(--ink);font-size:14px;font-weight:600;margin-bottom:6px}.endnote p{margin:0;max-width:940px}.footer-bottom{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);margin-top:26px;padding-top:18px;font-size:12px}.footer-bottom a{text-decoration:none}

-child{width:100%;background:var(--mint);padding:12px 17px;margin-bottom:6px;font-size:16px}td:not(:first-child)::before{content:attr(data-label);display:block;color:var(--muted);font-size:12px;margin-bottom:2px}td:last-child{padding-bottom:17px}.steps li{font-size:15px;padding-left:44px}.actions li{font-size:15px}.endnote{padding-top:24px}.footer-bottom{font-size:12px}.source-meta{font-size:12px;gap:4px 12px}}

/* Concise opening with a grid of concrete takeaways. */
.document-heading{padding:44px 0 25px}
.document-heading h1{font-size:36px;line-height:1.4;letter-spacing:-.5px;color:var(--ink);margin:0;font-weight:650}
.document-meta{display:flex;flex-wrap:wrap;gap:4px 0;color:var(--muted);font-size:13px;margin:12px 0 0;line-height:1.8}
.document-meta span+span:before{content:'·';margin:0 12px;color:#8b9c93}
.opening-summary{max-width:1040px;padding-bottom:24px}
.opening-summary>h2{font-size:17px;line-height:1.6;color:var(--accent);font-weight:600;margin:0 0 14px}
.selling-points-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.selling-point{padding:24px 26px;background:var(--paper);border:1px solid var(--line);border-radius:12px;min-width:0}
.selling-point.featured{background:var(--mint);border-color:#cbded2}
.selling-point h3{font-size:21px;line-height:1.55;letter-spacing:0;color:var(--ink);font-weight:650;margin:0 0 11px}
.selling-point.featured h3{color:#225c46}
.selling-point p{font-size:16px;line-height:1.85;margin:0;color:var(--text)}
.contents{font-size:14px;border-bottom:1px solid var(--line);padding:0 0 22px}
.contents summary{cursor:pointer;width:fit-content;color:var(--muted);padding:2px 0}
.contents summary:focus-visible{outline:2px solid var(--accent);outline-offset:5px}
.contents nav{display:flex;gap:10px 26px;flex-wrap:wrap;padding:16px 0 0 18px}
.contents a{color:var(--accent);text-decoration:none}
.contents a:hover{text-decoration:underline}
@media(max-width:760px){.document-heading{padding:28px 0 20px}.document-heading h1{font-size:28px;line-height:1.45;letter-spacing:0}.document-meta{font-size:12px;margin-top:10px}.document-meta span+span:before{margin:0 8px}.selling-point{padding:20px}.selling-point h3{font-size:19px}.selling-points-grid{gap:12px}.opening-summary{padding-bottom:18px}.contents{font-size:13px;padding-bottom:20px}.contents nav{gap:10px 22px}}
@media(max-width:600px){.selling-points-grid{grid-template-columns:1fr}.selling-point h3{font-size:20px}.selling-point p{font-size:16px}.opening-summary>h2{font-size:16px;margin-bottom:12px}}
@media print{.document-heading{padding:0 0 18px}.document-heading h1{font-size:25pt}.selling-point h3{font-size:14pt}.selling-point p{font-size:11pt}.selling-point{break-inside:avoid}.contents{display:none}.document-meta{font-size:9pt}}

.selling-points-grid.three-columns{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1000px){.selling-points-grid.three-columns{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.selling-points-grid.three-columns{grid-template-columns:1fr}}
@media print{.selling-points-grid.three-columns{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<a class="skip-link" href="#summary">跳到重点总结</a>
<div class="page">
<main id="top">
  <header class="document-heading">
    <h1 id="title">{{DOCUMENT_TITLE}}</h1>
    <p class="document-meta">{{META_HTML}}</p>
  </header>
  <section class="opening-summary" id="summary" aria-labelledby="summary-title">
    <h2 id="summary-title">重点总结</h2>
    <div class="selling-points-grid {{GRID_CLASS}}">
      {{SUMMARY_CARDS_HTML}}
    </div>
  </section>
  {{TOC_HTML}}
  <div class="chapters">
    {{CHAPTERS_HTML}}
  </div>
</main>
<footer class="endnote">
  <div class="footer-title">资料说明</div>
  {{SOURCE_NOTES_HTML}}
  <div class="footer-bottom">
    <span>{{DOCUMENT_TITLE}} · 智能总结</span>
    <a href="#summary">返回重点总结</a>
  </div>
</footer>
</div>
</body>
</html>
